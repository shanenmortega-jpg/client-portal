<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Approval Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4ebd8; color: #3a2a1a; min-height: 100vh; }

    header { background: #eaddc4; border-bottom: 1px solid #d9ccb0; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .logo img { height: 48px; width: auto; }
    .updated { font-size: 12px; color: #b59f8c; }

    main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; color: #3a2a1a; }
    .sub { font-size: 14px; color: #b59f8c; margin-bottom: 1.5rem; }

    .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .nav-month { font-size: 16px; font-weight: 600; color: #3a2a1a; }
    .nav-btns { display: flex; gap: 6px; }
    .nav-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #d9ccb0; background: #eaddc4; cursor: pointer; font-size: 13px; color: #3a2a1a; }
    .nav-btn:hover { background: #c5a0e3; border-color: #c5a0e3; color: #fff; }

    .calendar { background: #fdf7ee; border: 1px solid #d9ccb0; border-radius: 14px; overflow: hidden; }
    .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid #d9ccb0; }
    .cal-header div { padding: 10px 0; text-align: center; font-size: 12px; font-weight: 500; color: #b59f8c; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal-cell { min-height: 100px; padding: 8px; border-right: 1px solid #ede3d0; border-bottom: 1px solid #ede3d0; position: relative; vertical-align: top; }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-day { font-size: 12px; color: #b59f8c; margin-bottom: 4px; }
    .cal-day.today { background: #c5a0e3; color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; }
    .cal-cell.other-month .cal-day { color: #d9ccb0; }

    .cal-item { background: #ede3f7; border-left: 3px solid #c5a0e3; border-radius: 5px; padding: 4px 6px; margin-bottom: 4px; cursor: pointer; transition: all 0.15s; }
    .cal-item:hover { background: #dbc8f0; }
    .cal-item.done { background: #e0eed8; border-left-color: #b7cea9; }
    .cal-item-title { font-size: 11px; font-weight: 500; color: #3a2a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-item-tag { font-size: 10px; color: #b59f8c; }

    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(58,42,26,0.4); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
    .modal-bg.open { display: flex; }
    .modal { background: #fdf7ee; border: 1px solid #d9ccb0; border-radius: 16px; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; }
    .modal-header { padding: 1.5rem 1.5rem 0; display: flex; justify-content: space-between; align-items: flex-start; }
    .modal-title { font-size: 20px; font-weight: 600; flex: 1; margin-right: 12px; color: #3a2a1a; }
    .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #b59f8c; padding: 0; line-height: 1; }
    .modal-close:hover { color: #c5a0e3; }
    .modal-meta { padding: 0.75rem 1.5rem; display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .b-progress { background: #ede3f7; color: #c5a0e3; }
    .b-done { background: #e0eed8; color: #b7cea9; }
    .b-default { background: #eaddc4; color: #b59f8c; }
    .modal-embed { margin: 0 1.5rem; border-radius: 10px; overflow: hidden; background: #eaddc4; }
    .modal-embed iframe { width: 100%; height: 400px; border: none; display: block; }
    .modal-no-embed { padding: 3rem; text-align: center; color: #b59f8c; font-size: 14px; }
    .modal-actions { padding: 1.25rem 1.5rem; border-top: 1px solid #d9ccb0; margin-top: 1.25rem; }
    .comment-label { font-size: 12px; color: #b59f8c; margin-bottom: 6px; }
    textarea { width: 100%; font-size: 13px; padding: 10px 12px; border: 1px solid #d9ccb0; border-radius: 10px; background: #f4ebd8; color: #3a2a1a; resize: none; min-height: 70px; font-family: inherit; }
    textarea:focus { outline: none; border-color: #c5a0e3; }
    .action-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    .btn { padding: 9px 20px; font-size: 13px; border-radius: 10px; cursor: pointer; font-family: inherit; font-weight: 500; border: 1px solid; transition: all 0.15s; }
    .btn-approve { background: #e0eed8; color: #5a8a50; border-color: #b7cea9; }
    .btn-approve:hover { background: #b7cea9; color: #fff; }
    .btn-changes { background: #ede3f7; color: #8a50b0; border-color: #c5a0e3; }
    .btn-changes:hover { background: #c5a0e3; color: #fff; }
    .result-banner { display: flex; align-items: center; gap: 8px; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 500; margin-top: 10px; }
    .r-approved { background: #e0eed8; color: #5a8a50; }
    .r-changes { background: #ede3f7; color: #8a50b0; }

    .loading { text-align: center; padding: 4rem; color: #b59f8c; font-size: 14px; }
    .spinner { width: 28px; height: 28px; border: 2px solid #d9ccb0; border-top-color: #c5a0e3; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .cal-cell { min-height: 60px; padding: 4px; }
      .cal-item-tag { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><img src="./ON LOGO.png" alt="Oatmeal's Naturals" /></div>
  <div class="updated" id="updated"></div>
</header>

<main>
  <h1>Content for your review</h1>
  <p class="sub" id="subtitle">Loading your content calendar...</p>

  <div class="nav">
    <div class="nav-month" id="nav-month"></div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="changeMonth(-1)">← Prev</button>
      <button class="nav-btn" onclick="changeMonth(0)">Today</button>
      <button class="nav-btn" onclick="changeMonth(1)">Next →</button>
    </div>
  </div>

  <div id="calendar-wrap">
    <div class="loading"><div class="spinner"></div>Fetching from Notion...</div>
  </div>
</main>

<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="modal-embed" id="modal-embed"></div>
    <div class="modal-actions">
      <div class="comment-label">Leave a comment</div>
      <textarea id="modal-comment" placeholder="Any feedback or notes..."></textarea>
      <div id="modal-action-area" class="action-row"></div>
    </div>
  </div>
</div>

<script>
  let allItems = [];
  let decisions = {};
  let currentDate = new Date();
  let currentYear = currentDate.getFullYear();
  let currentMonth = currentDate.getMonth();
  let activeItemId = null;

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  async function fetchItems() {
    const res = await fetch('/api/notion');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data.items || [];
  }

  function renderCalendar() {
    document.getElementById('nav-month').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
    const wrap = document.getElementById('calendar-wrap');

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();
    const today = new Date();

    const itemsByDate = {};
    allItems.forEach(item => {
      if (!item.dateRaw) return;
      const d = item.dateRaw.slice(0, 10);
      if (!itemsByDate[d]) itemsByDate[d] = [];
      itemsByDate[d].push(item);
    });

    let cells = '';
    for (let i = 0; i < firstDay; i++) {
      const day = daysInPrev - firstDay + i + 1;
      cells += `<div class="cal-cell other-month"><div class="cal-day">${day}</div></div>`;
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d;
      const dayItems = itemsByDate[dateStr] || [];

      const dayHTML = isToday
        ? `<div class="cal-day today">${d}</div>`
        : `<div class="cal-day">${d}</div>`;

      const itemsHTML = dayItems.map(item => {
        const dec = decisions[item.id];
        const doneClass = (item.status||'').toLowerCase().includes('done') || dec === 'approved' ? 'done' : '';
        return `<div class="cal-item ${doneClass}" onclick="openModal('${item.id}')">
          <div class="cal-item-title">${item.title || 'Untitled'}</div>
          <div class="cal-item-tag">${item.type || ''}</div>
        </div>`;
      }).join('');

      cells += `<div class="cal-cell"><div>${dayHTML}${itemsHTML}</div></div>`;
    }

    const totalCells = firstDay + daysInMonth;
    const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
    for (let i = 1; i <= remaining; i++) {
      cells += `<div class="cal-cell other-month"><div class="cal-day">${i}</div></div>`;
    }

    wrap.innerHTML = `<div class="calendar">
      <div class="cal-header">${DAYS.map(d => `<div>${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>`;
  }

  function changeMonth(dir) {
    if (dir === 0) { currentYear = new Date().getFullYear(); currentMonth = new Date().getMonth(); }
    else { currentMonth += dir; if (currentMonth > 11) { currentMonth = 0; currentYear++; } if (currentMonth < 0) { currentMonth = 11; currentYear--; } }
    renderCalendar();
  }

  function openModal(id) {
    activeItemId = id;
    const item = allItems.find(i => i.id === id);
    if (!item) return;

    document.getElementById('modal-title').textContent = item.title || 'Untitled';

    const badgeClass = (item.status||'').toLowerCase().includes('progress') ? 'b-progress'
      : (item.status||'').toLowerCase().includes('done') ? 'b-done' : 'b-default';
    document.getElementById('modal-meta').innerHTML = `
      ${item.status ? `<span class="badge ${badgeClass}">${item.status}</span>` : ''}
      ${item.type ? `<span class="badge b-default">${item.type}</span>` : ''}
      ${item.date ? `<span class="badge b-default">📅 ${item.date}</span>` : ''}
    `;

    const embedWrap = document.getElementById('modal-embed');
    if (item.embedUrl) {
      embedWrap.innerHTML = `<iframe src="${item.embedUrl}" allowfullscreen></iframe>`;
    } else {
      embedWrap.innerHTML = `<div class="modal-no-embed">No preview available</div>`;
    }

    document.getElementById('modal-comment').value = '';
    renderModalActions(id);
    document.getElementById('modal-bg').classList.add('open');
  }

  function renderModalActions(id) {
    const dec = decisions[id];
    const area = document.getElementById('modal-action-area');
    if (dec === 'approved') {
      area.innerHTML = `<div class="result-banner r-approved" style="width:100%">✓ Approved</div>`;
    } else if (dec === 'changes') {
      area.innerHTML = `<div class="result-banner r-changes" style="width:100%">✎ Changes requested</div>`;
    } else {
      area.innerHTML = `
        <button class="btn" style="background:#eaddc4;border-color:#d9ccb0;color:#b59f8c" onclick="sendComment('${id}')">Send comment</button>
        <button class="btn btn-changes" onclick="decide('${id}','changes')">Request changes</button>
        <button class="btn btn-approve" onclick="decide('${id}','approved')">Approve ✓</button>
      `;
    }
  }

  async function decide(id, action) {
    decisions[id] = action;
    renderModalActions(id);
    renderCalendar();
    const comment = document.getElementById('modal-comment').value;
    await fetch('/api/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pageId: id, comment, decision: action })
    });
  }

  async function sendComment(id) {
    const comment = document.getElementById('modal-comment').value;
    if (!comment.trim()) return;
    await fetch('/api/notion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pageId: id, comment })
    });
    document.getElementById('modal-comment').value = '';
    alert('Comment sent!');
  }

  function closeModal(e) { if (e.target === document.getElementById('modal-bg')) closeModalDirect(); }
  function closeModalDirect() {
    document.getElementById('modal-bg').classList.remove('open');
    document.getElementById('modal-embed').innerHTML = '';
    activeItemId = null;
  }

  async function init() {
    try {
      allItems = await fetchItems();
      document.getElementById('subtitle').textContent = `${allItems.length} item${allItems.length !== 1 ? 's' : ''} ready for your review`;
      document.getElementById('updated').textContent = 'Updated just now';
      renderCalendar();
    } catch(e) {
      document.getElementById('subtitle').textContent = 'Could not load items';
      document.getElementById('calendar-wrap').innerHTML = `<div style="background:#ede3f7;color:#8a50b0;border-radius:12px;padding:1.25rem;font-size:14px">Could not connect to Notion. Error: ${e.message}</div>`;
    }
  }

  init();
  setInterval(init, 60000);
</script>
</body>
</html>
